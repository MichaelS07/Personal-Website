<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Meta creative test board: one winning ad checked, losers faded, Advantage+ budget held until September test finishes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="1020" cy="100" r="150" fill="#10b981" opacity="0.12"/>
  <circle cx="140" cy="700" r="130" fill="#34d399" opacity="0.14"/>

  <!-- Ads Manager chrome -->
  <rect x="80" y="100" width="1040" height="580" rx="28" fill="#fff" stroke="#e2e8f0" filter="url(#s)"/>
  <rect x="80" y="100" width="1040" height="72" rx="28" fill="#0f172a"/>
  <rect x="80" y="148" width="1040" height="24" fill="#0f172a"/>
  <text x="120" y="145" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#fff">Ads Manager · Creative test</text>
  <rect x="880" y="118" width="200" height="36" rx="10" fill="#10b981"/>
  <text x="980" y="142" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Advantage+</text>

  <!-- Budget slider panel -->
  <rect x="120" y="200" width="300" height="140" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="140" y="235" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#64748b">Q4 budget</text>
  <text x="140" y="270" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800" fill="#0f172a">Hold scale</text>
  <rect x="140" y="295" width="220" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="140" y="295" width="70" height="10" rx="5" fill="#10b981"/>
  <circle cx="210" cy="300" r="12" fill="#10b981" stroke="#fff" stroke-width="3"/>
  <text x="140" y="330" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#059669">Test before you scale · Sep</text>

  <!-- Creative cards -->
  <!-- Winner -->
  <rect x="460" y="200" width="200" height="280" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="3" filter="url(#s)"/>
  <rect x="480" y="220" width="160" height="100" rx="12" fill="#a7f3d0"/>
  <text x="560" y="280" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="800" fill="#047857" text-anchor="middle">UGC</text>
  <text x="560" y="350" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Hook A · Offer</text>
  <text x="560" y="375" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#047857" text-anchor="middle">Landing matched</text>
  <circle cx="620" cy="230" r="18" fill="#10b981"/>
  <path d="M610 230 l6 6 12 -12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="560" y="430" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">WINNER</text>
  <text x="560" y="455" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#059669" text-anchor="middle">CPA ↓ 28%</text>

  <!-- Loser 1 -->
  <rect x="690" y="210" width="180" height="260" rx="16" fill="#fff" stroke="#e2e8f0" opacity="0.55"/>
  <rect x="708" y="228" width="144" height="88" rx="10" fill="#f1f5f9"/>
  <text x="780" y="280" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#94a3b8" text-anchor="middle">Studio</text>
  <text x="780" y="350" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">Last year's cut</text>
  <line x1="720" y1="380" x2="840" y2="420" stroke="#ef4444" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="840" y1="380" x2="720" y2="420" stroke="#ef4444" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <text x="780" y="450" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">KILL</text>

  <!-- Loser 2 -->
  <rect x="900" y="210" width="180" height="260" rx="16" fill="#fff" stroke="#e2e8f0" opacity="0.45"/>
  <rect x="918" y="228" width="144" height="88" rx="10" fill="#f1f5f9"/>
  <text x="990" y="280" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#94a3b8" text-anchor="middle">Hook B</text>
  <text x="990" y="350" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">No landing match</text>
  <line x1="930" y1="380" x2="1050" y2="420" stroke="#ef4444" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="1050" y1="380" x2="930" y2="420" stroke="#ef4444" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <text x="990" y="450" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">KILL</text>

  <!-- Note bar -->
  <rect x="120" y="520" width="960" height="120" rx="18" fill="#0f172a"/>
  <text x="160" y="570" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#fff">One September creative test beats a November budget raise</text>
  <text x="160" y="605" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#94a3b8">Hooks · offers · UGC vs studio · kill losers before Advantage+ scale · CAPI sanity</text>

  <text x="60" y="760" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#10b981">Nova Reach</text>
</svg>
