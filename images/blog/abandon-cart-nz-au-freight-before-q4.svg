<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Checkout with freight and GST shown early; discount line crossed out">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="980" cy="120" r="160" fill="#10b981" opacity="0.12"/>
  <circle cx="180" cy="680" r="120" fill="#34d399" opacity="0.15"/>
  <!-- Cart panel -->
  <rect x="120" y="140" width="520" height="520" rx="28" fill="#fff" stroke="#e2e8f0" filter="url(#s)"/>
  <text x="160" y="200" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Order summary</text>
  <rect x="160" y="230" width="120" height="90" rx="12" fill="#f1f5f9"/>
  <rect x="300" y="245" width="220" height="18" rx="6" fill="#cbd5e1"/>
  <rect x="300" y="275" width="160" height="14" rx="5" fill="#e2e8f0"/>
  <text x="500" y="270" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" fill="#0f172a" text-anchor="end">$89.00</text>
  <!-- Freight truth -->
  <rect x="160" y="350" width="440" height="64" rx="14" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="180" y="378" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#047857">Freight (rural NZ)</text>
  <text x="580" y="378" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#047857" text-anchor="end">$12.50</text>
  <text x="180" y="400" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#059669">Shown on PDP · incl. GST</text>
  <!-- Discount crossed out -->
  <rect x="160" y="440" width="440" height="56" rx="14" fill="#fef2f2" stroke="#fecaca"/>
  <text x="180" y="475" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#991b1b">Default 10% code</text>
  <text x="580" y="475" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#991b1b" text-anchor="end">−$8.90</text>
  <line x1="170" y1="468" x2="590" y2="468" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <text x="160" y="540" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#64748b">Fix freight truth first. Discount later — if at all.</text>
  <!-- Email card -->
  <rect x="700" y="200" width="380" height="400" rx="28" fill="#0f172a" filter="url(#s)"/>
  <text x="740" y="260" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#fff">Abandon email 1</text>
  <text x="740" y="300" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#94a3b8">No code · shipping line included</text>
  <rect x="740" y="330" width="300" height="14" rx="5" fill="#334155"/>
  <rect x="740" y="360" width="240" height="14" rx="5" fill="#334155"/>
  <rect x="740" y="400" width="300" height="70" rx="14" fill="#10b981"/>
  <text x="890" y="442" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Complete order</text>
  <text x="740" y="520" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#64748b">Before Q4 · NZ / AU Shopify</text>
  <text x="60" y="760" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#10b981">Nova Reach</text>
</svg>
