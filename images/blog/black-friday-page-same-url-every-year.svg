    <text x="160" y="378" fill="#64748b">/black-friday-2025</text>
    <rect x="130" y="450" width="380" height="80" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="160" y="498" fill="#64748b">/black-friday-2026</text>
    <text x="452" y="258" font-size="15" font-weight="700" fill="#10b981" text-anchor="end">301</text>
    <text x="452" y="378" font-size="15" font-weight="700" fill="#10b981" text-anchor="end">301</text>
    <text x="452" y="498" font-size="15" font-weight="700" fill="#10b981" text-anchor="end">301</text>
