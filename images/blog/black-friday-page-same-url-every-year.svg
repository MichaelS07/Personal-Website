  <text x="985" y="119" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#fff">Keep it live</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="20">
    <rect x="130" y="210" width="380" height="80" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="160" y="258" fill="#64748b">/black-friday-2024</text>
