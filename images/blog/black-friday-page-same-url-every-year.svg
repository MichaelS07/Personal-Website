  <path d="M520 250 C 600 250 620 330 690 360" stroke="#10b981" stroke-width="5" fill="none" stroke-dasharray="4 10" stroke-linecap="round" marker-end="url(#ah)"/>
  <path d="M520 370 L 690 370" stroke="#10b981" stroke-width="5" fill="none" stroke-dasharray="4 10" stroke-linecap="round" marker-end="url(#ah)"/>
  <path d="M520 490 C 600 490 620 410 690 380" stroke="#10b981" stroke-width="5" fill="none" stroke-dasharray="4 10" stroke-linecap="round" marker-end="url(#ah)"/>

  <rect x="710" y="250" width="370" height="240" rx="18" fill="#0f172a"/>
  <text x="740" y="296" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#34d399">ONE PERMANENT PAGE</text>
  <text x="740" y="346" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#fff">/black-friday</text>
  <rect x="740" y="380" width="310" height="40" rx="10" fill="#1e293b"/>
