<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Q4 paid pacing board: healthy October bar for pools and learning, expensive November peak, reserve chip, fund October or overpay in November">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="octBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="novBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="1050" cy="120" r="160" fill="#10b981" opacity="0.12"/>
  <circle cx="120" cy="680" r="140" fill="#34d399" opacity="0.14"/>

  <!-- Main board -->
  <rect x="80" y="90" width="1040" height="600" rx="28" fill="#fff" stroke="#e2e8f0" filter="url(#s)"/>
  <rect x="80" y="90" width="1040" height="72" rx="28" fill="#0f172a"/>
  <rect x="80" y="138" width="1040" height="24" fill="#0f172a"/>
  <text x="120" y="138" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#fff">Q4 Paid Pacing · Oct → Dec</text>
  <rect x="860" y="110" width="220" height="36" rx="10" fill="#10b981"/>
  <text x="970" y="134" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Build pools first</text>

  <!-- Chart area -->
  <rect x="120" y="200" width="720" height="340" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- Y axis labels -->
  <text x="140" y="240" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#94a3b8">CPC / spend</text>
  <line x1="180" y1="260" x2="800" y2="260" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="180" y1="340" x2="800" y2="340" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="180" y1="420" x2="800" y2="420" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="180" y1="500" x2="800" y2="500" stroke="#cbd5e1" stroke-width="2"/>

  <!-- October bar — healthy mid height -->
  <rect x="230" y="320" width="120" height="180" rx="12" fill="url(#octBar)" filter="url(#s)"/>
  <text x="290" y="310" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">OCTOBER</text>
  <text x="290" y="370" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Build pools</text>
  <text x="290" y="392" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#ecfdf5" text-anchor="middle">Test · Learn</text>
  <text x="290" y="414" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#ecfdf5" text-anchor="middle">Calm CPCs</text>
  <text x="290" y="530" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Oct</text>

  <!-- November bar — tall expensive -->
  <rect x="420" y="250" width="120" height="250" rx="12" fill="url(#novBar)" filter="url(#s)"/>
  <text x="480" y="240" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#b45309" text-anchor="middle">NOVEMBER</text>
  <text x="480" y="300" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">EXPENSIVE</text>
  <text x="480" y="322" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#fffbeb" text-anchor="middle">Peak CPCs</text>
  <text x="480" y="344" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#fffbeb" text-anchor="middle">BFCM auction</text>
  <text x="480" y="530" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Nov</text>

  <!-- December bar — taper -->
  <rect x="610" y="360" width="120" height="140" rx="12" fill="#64748b" opacity="0.85"/>
  <text x="670" y="350" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">DECEMBER</text>
  <text x="670" y="410" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Harvest</text>
  <text x="670" y="432" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Warm pools</text>
  <text x="670" y="530" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Dec</text>

  <!-- Side panel: reserve + pools -->
  <rect x="870" y="200" width="210" height="340" rx="18" fill="#0f172a"/>
  <text x="975" y="240" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">HOLD BACK</text>
  <rect x="900" y="260" width="150" height="56" rx="14" fill="#10b981"/>
  <text x="975" y="285" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#ecfdf5" text-anchor="middle">RESERVE</text>
  <text x="975" y="305" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">Surprise days</text>

  <text x="975" y="360" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">October builds</text>
  <rect x="900" y="380" width="150" height="36" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="975" y="404" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle">Remarketing</text>
  <rect x="900" y="430" width="150" height="36" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="975" y="454" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle">Email / SMS</text>
  <rect x="900" y="480" width="150" height="36" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="975" y="504" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle">Learning data</text>

  <!-- Note bar -->
  <rect x="120" y="560" width="960" height="90" rx="18" fill="#0f172a"/>
  <text x="160" y="600" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#fff">Fund October or overpay in November</text>
  <text x="160" y="630" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#94a3b8">Step-up budgets · Google + Meta split · contribution / MER · keep a reserve</text>

  <text x="60" y="760" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#10b981">Nova Reach</text>
</svg>
