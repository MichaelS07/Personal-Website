<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="A checkout summary with an automatic 30% sale and an email code, and two outcomes: the code silently ignored because discounts don't combine, or both applied and margin lost">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="1080" cy="100" r="150" fill="#10b981" opacity="0.12"/>
  <circle cx="110" cy="700" r="130" fill="#34d399" opacity="0.14"/>

  <rect x="70" y="80" width="1060" height="620" rx="28" fill="#fff" stroke="#e2e8f0" filter="url(#s)"/>
  <rect x="70" y="80" width="1060" height="64" rx="28" fill="#0f172a"/>
  <rect x="70" y="116" width="1060" height="28" fill="#0f172a"/>
  <text x="110" y="122" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#fff">Shopify checkout · Discount stacking</text>
  <rect x="880" y="96" width="210" height="34" rx="17" fill="url(#g)"/>
  <text x="985" y="119" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#fff">Test before BFCM</text>

  <!-- Checkout card -->
  <rect x="120" y="190" width="420" height="440" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="150" y="234" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#475569">ORDER SUMMARY</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#0f172a">
    <text x="150" y="290">Subtotal</text><text x="510" y="290" text-anchor="end">$120.00</text>
    <text x="150" y="340" fill="#047857">BLACK FRIDAY 30% (auto)</text><text x="510" y="340" text-anchor="end" fill="#047857">−$36.00</text>
    <text x="150" y="390" fill="#475569">Code SIGNAL10</text><text x="510" y="390" text-anchor="end" fill="#be123c">?</text>
    <text x="150" y="440">Shipping</text><text x="510" y="440" text-anchor="end">Free</text>
  </g>
  <line x1="150" y1="470" x2="510" y2="470" stroke="#e2e8f0" stroke-width="2"/>
  <text x="150" y="515" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Total</text>
  <text x="510" y="515" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a">?</text>
  <rect x="150" y="550" width="360" height="54" rx="12" fill="url(#g)"/>
  <text x="330" y="584" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#fff">Pay now</text>

  <!-- Outcomes -->
  <rect x="590" y="190" width="490" height="205" rx="18" fill="#fff1f2" stroke="#fda4af"/>
  <text x="620" y="236" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#be123c">DON'T COMBINE</text>
  <text x="620" y="280" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#0f172a">Code ignored. Total stays $84.</text>
  <text x="620" y="318" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">Customer thinks the code is broken</text>
  <text x="620" y="352" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">and may leave.</text>

  <rect x="590" y="425" width="490" height="205" rx="18" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="620" y="471" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#b45309">COMBINE</text>
  <text x="620" y="515" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#0f172a">Both apply. Total $75.60.</text>
  <text x="620" y="553" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">Fine if you planned it.</text>
  <text x="620" y="587" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">Costly if you didn't.</text>
</svg>
