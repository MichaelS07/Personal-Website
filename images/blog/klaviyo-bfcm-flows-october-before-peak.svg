<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Klaviyo flow board: three email sequence lanes labeled Welcome, Browse, and Winback under an October calendar chip, with BFCM peak marked too late to start and tagline Ship flows in October">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="laneA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="laneB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="laneC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="1080" cy="100" r="150" fill="#10b981" opacity="0.12"/>
  <circle cx="100" cy="700" r="130" fill="#34d399" opacity="0.14"/>

  <!-- Main board -->
  <rect x="70" y="80" width="1060" height="620" rx="28" fill="#fff" stroke="#e2e8f0" filter="url(#s)"/>
  <rect x="70" y="80" width="1060" height="72" rx="28" fill="#0f172a"/>
  <rect x="70" y="128" width="1060" height="24" fill="#0f172a"/>
  <text x="110" y="128" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#fff">Klaviyo Flows · Before BFCM</text>
  <rect x="820" y="100" width="270" height="36" rx="10" fill="#10b981"/>
  <text x="955" y="124" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Ship flows in October</text>

  <!-- October calendar chip -->
  <rect x="110" y="190" width="200" height="70" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="210" y="220" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#047857" text-anchor="middle">OCTOBER 2026</text>
  <text x="210" y="244" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a" text-anchor="middle">Build now</text>

  <!-- BFCM too late chip -->
  <rect x="340" y="190" width="280" height="70" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="480" y="220" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#b45309" text-anchor="middle">BFCM WEEK</text>
  <text x="480" y="244" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="#92400e" text-anchor="middle">Too late to start</text>

  <!-- Paid feeds chip -->
  <rect x="650" y="190" width="420" height="70" rx="14" fill="#0f172a"/>
  <text x="860" y="220" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">PAID → OWNED</text>
  <text x="860" y="244" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#34d399" text-anchor="middle">Google + Meta feed the list</text>

  <!-- Three flow lanes -->
  <!-- Welcome -->
  <rect x="110" y="290" width="300" height="280" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="110" y="290" width="300" height="48" rx="18" fill="url(#laneA)"/>
  <rect x="110" y="314" width="300" height="24" fill="url(#laneA)"/>
  <text x="260" y="322" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">Welcome</text>
  <!-- sequence cards -->
  <rect x="130" y="360" width="260" height="44" rx="10" fill="#fff" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="158" cy="382" r="10" fill="#10b981"/>
  <text x="158" y="386" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="180" y="388" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Brand + offer clarity</text>
  <rect x="130" y="418" width="260" height="44" rx="10" fill="#fff" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="158" cy="440" r="10" fill="#10b981"/>
  <text x="158" y="444" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="180" y="446" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Social proof / bestsellers</text>
  <rect x="130" y="476" width="260" height="44" rx="10" fill="#fff" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="158" cy="498" r="10" fill="#10b981"/>
  <text x="158" y="502" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="180" y="504" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">First purchase nudge</text>
  <text x="260" y="550" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">New subscribers → buyers</text>

  <!-- Browse -->
  <rect x="450" y="290" width="300" height="280" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="450" y="290" width="300" height="48" rx="18" fill="url(#laneB)"/>
  <rect x="450" y="314" width="300" height="24" fill="url(#laneB)"/>
  <text x="600" y="322" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">Browse</text>
  <rect x="470" y="360" width="260" height="44" rx="10" fill="#fff" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="498" cy="382" r="10" fill="#10b981"/>
  <text x="498" y="386" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="520" y="388" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Viewed product reminder</text>
  <rect x="470" y="418" width="260" height="44" rx="10" fill="#fff" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="498" cy="440" r="10" fill="#10b981"/>
  <text x="498" y="444" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="520" y="446" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Freight / GST clarity</text>
  <rect x="470" y="476" width="260" height="44" rx="10" fill="#fff" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="498" cy="498" r="10" fill="#10b981"/>
  <text x="498" y="502" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="520" y="504" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Soft offer (not 10% only)</text>
  <text x="600" y="550" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Browsers → warm demand</text>

  <!-- Winback -->
  <rect x="790" y="290" width="300" height="280" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="790" y="290" width="300" height="48" rx="18" fill="url(#laneC)"/>
  <rect x="790" y="314" width="300" height="24" fill="url(#laneC)"/>
  <text x="940" y="322" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">Winback</text>
  <rect x="810" y="360" width="260" height="44" rx="10" fill="#fff" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="838" cy="382" r="10" fill="#10b981"/>
  <text x="838" y="386" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="860" y="388" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Lapsed buyer check-in</text>
  <rect x="810" y="418" width="260" height="44" rx="10" fill="#fff" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="838" cy="440" r="10" fill="#10b981"/>
  <text x="838" y="444" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="860" y="446" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Relevant SKU / restock</text>
  <rect x="810" y="476" width="260" height="44" rx="10" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="838" cy="498" r="10" fill="#64748b"/>
  <text x="838" y="502" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="860" y="504" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Sunset / preference ask</text>
  <text x="940" y="550" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Lapsed → re-engaged or clean</text>

  <!-- Bottom tagline bar -->
  <rect x="110" y="600" width="980" height="70" rx="16" fill="#0f172a"/>
  <text x="150" y="632" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#fff">Don't wait until Black Friday week to build your flows</text>
  <text x="150" y="656" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94a3b8">Welcome · Browse · Winback — live and fed by paid before peak</text>

  <text x="60" y="760" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#10b981">Nova Reach</text>
</svg>
