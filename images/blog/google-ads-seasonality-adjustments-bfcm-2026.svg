<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="A conversion rate chart where Smart Bidding lags behind a Black Friday spike, and a seasonality adjustment window from 27 to 30 November lifts bids from the first hour">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="1080" cy="100" r="150" fill="#10b981" opacity="0.12"/>
  <circle cx="110" cy="700" r="130" fill="#34d399" opacity="0.14"/>

  <rect x="70" y="80" width="1060" height="620" rx="28" fill="#fff" stroke="#e2e8f0" filter="url(#s)"/>
  <rect x="70" y="80" width="1060" height="64" rx="28" fill="#0f172a"/>
  <rect x="70" y="116" width="1060" height="28" fill="#0f172a"/>
  <text x="110" y="122" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#fff">Google Ads · Seasonality adjustment</text>
  <rect x="880" y="96" width="210" height="34" rx="17" fill="url(#g)"/>
  <text x="985" y="119" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#fff">27–30 Nov</text>

  <rect x="120" y="190" width="960" height="460" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="150" y="234" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#475569">CONVERSION RATE vs BIDDING</text>

  <!-- adjustment window -->
  <rect x="640" y="260" width="250" height="320" fill="#10b981" opacity="0.12"/>
  <rect x="640" y="260" width="250" height="40" fill="#10b981" opacity="0.25"/>
  <text x="765" y="287" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#047857">Adjustment window</text>

  <path d="M170 580 H1040 M170 480 H1040 M170 380 H1040" stroke="#e2e8f0" stroke-width="2"/>
  <!-- actual conversion rate -->
  <path d="M170 500 L300 495 L430 490 L560 485 L640 480 L660 340 L760 330 L870 345 L890 470 L960 485 L1040 490" stroke="#0f172a" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- lagging bids -->
  <path d="M170 505 L640 490 C 700 485 760 450 820 400 C 880 360 930 380 960 430 L1040 470" stroke="#fb7185" stroke-width="5" fill="none" stroke-dasharray="12 10" stroke-linecap="round"/>
  <!-- adjusted bids -->
  <path d="M170 505 L640 490 L650 350 L880 345 L895 480 L1040 492" stroke="url(#g)" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#475569">
    <rect x="170" y="604" width="22" height="6" rx="3" fill="#0f172a"/><text x="202" y="613">Conversion rate</text>
    <rect x="380" y="604" width="22" height="6" rx="3" fill="#fb7185"/><text x="412" y="613">Bidding catching up</text>
    <rect x="620" y="604" width="22" height="6" rx="3" fill="#10b981"/><text x="652" y="613">With the adjustment</text>
  </g>
</svg>
