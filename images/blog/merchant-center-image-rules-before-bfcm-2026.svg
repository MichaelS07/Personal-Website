<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Two product images side by side: one with a Black Friday 30% off badge marked disapproved, and a clean product photo marked approved, under a Merchant Center image rules header">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="tub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b1611"/>
      <stop offset="50%" stop-color="#1f2b25"/>
      <stop offset="100%" stop-color="#0b1611"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="1080" cy="100" r="150" fill="#10b981" opacity="0.12"/>
  <circle cx="110" cy="700" r="130" fill="#34d399" opacity="0.14"/>

  <rect x="70" y="80" width="1060" height="620" rx="28" fill="#fff" stroke="#e2e8f0" filter="url(#s)"/>
  <rect x="70" y="80" width="1060" height="64" rx="28" fill="#0f172a"/>
  <rect x="70" y="116" width="1060" height="28" fill="#0f172a"/>
  <text x="110" y="122" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#fff">Merchant Center · Product image rules</text>
  <rect x="880" y="96" width="210" height="34" rx="17" fill="url(#g)"/>
  <text x="985" y="119" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#fff">Before BFCM</text>

  <!-- Bad image -->
  <rect x="140" y="190" width="420" height="380" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="290" y="270" width="120" height="160" rx="14" fill="url(#tub)"/>
  <rect x="280" y="252" width="140" height="28" rx="8" fill="#10b981"/>
  <rect x="306" y="330" width="88" height="26" rx="5" fill="#fff"/>
  <text x="350" y="349" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0b1611">WHEY</text>
  <g transform="rotate(-12 250 260)">
    <rect x="160" y="225" width="240" height="70" rx="12" fill="#be123c"/>
    <text x="280" y="258" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#fff">BLACK FRIDAY</text>
    <text x="280" y="283" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#fecdd3">30% OFF</text>
  </g>
  <rect x="160" y="490" width="380" height="56" rx="12" fill="#fff1f2" stroke="#fda4af"/>
  <text x="350" y="525" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#be123c">✕  Disapproved: text on image</text>

  <!-- Good image -->
  <rect x="640" y="190" width="420" height="380" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="790" y="270" width="120" height="160" rx="14" fill="url(#tub)"/>
  <rect x="780" y="252" width="140" height="28" rx="8" fill="#10b981"/>
  <rect x="806" y="330" width="88" height="26" rx="5" fill="#fff"/>
  <text x="850" y="349" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0b1611">WHEY</text>
  <rect x="660" y="490" width="380" height="56" rx="12" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="850" y="525" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#047857">✓  Approved: clean product</text>

  <!-- Footer -->
  <rect x="140" y="600" width="920" height="70" rx="16" fill="#0f172a"/>
  <text x="600" y="643" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#cbd5e1">Put the offer in the ad, the promotion or the price. Not on the photo.</text>
</svg>
