<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
      </style>
      <div id="root" data-composition-id="bg" data-width="1920" data-height="1080" data-layout-allow-overflow>
        <div class="bg-grid" id="bg-grid"></div>
        <div class="bg-glow g1" id="bg-g1"></div>
        <div class="bg-glow g2" id="bg-g2"></div>
        <div class="bg-vignette"></div>
      </div>
      <script>
        (function () {
        const TOTAL = 528.18;
        const tl = gsap.timeline({ paused: true });
        const r1 = Math.max(0, Math.floor(TOTAL / 7) - 1);
        const r2 = Math.max(0, Math.floor(TOTAL / 9) - 1);
        tl.fromTo("#bg-g1", { x: 0, y: 0, scale: 1 }, { x: 160, y: 90, scale: 1.12, duration: 7, ease: "sine.inOut", yoyo: true, repeat: r1 }, 0);
        tl.fromTo("#bg-g2", { x: 0, y: 0, scale: 1.08 }, { x: -140, y: -70, scale: 1, duration: 9, ease: "sine.inOut", yoyo: true, repeat: r2 }, 0);
        tl.fromTo("#bg-grid", { x: 0, y: 0 }, { x: 80, y: 80, duration: TOTAL, ease: "none" }, 0);
        window.__timelines["bg"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
