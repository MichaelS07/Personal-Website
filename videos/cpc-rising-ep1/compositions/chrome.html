      </div>
      <script>
        (function () {
        const TOTAL = 528.18;
        const CH = [[0.0, "The hook"], [25.97, "The plan"], [50.1, "Is it a problem?"], [99.98, "How CPC is set"], [154.51, "Cause 1 \u00b7 Competition"], [208.27, "Cause 2 \u00b7 Quality Score"], [266.02, "Cause 3 \u00b7 Your bidding"], [322.21, "Cause 4 \u00b7 Search terms"], [371.25, "Cause 5 \u00b7 Seasonality"], [410.31, "Cause 6 \u00b7 Tracking"], [462.02, "The 15-min checklist"], [505.09, "Recap"]];
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#progress-fill", { scaleX: 0 }, { scaleX: 1, duration: TOTAL, ease: "none" }, 0);
        CH.forEach(function (c, i) {
          const el = "#chapter-" + i;
          tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, c[0] + 0.3);
          if (i < CH.length - 1) tl.to(el, { opacity: 0, y: -10, duration: 0.3, ease: "power2.in" }, CH[i + 1][0] - 0.1);
        });
        window.__timelines["chrome"] = tl;
        })();
      </script>
