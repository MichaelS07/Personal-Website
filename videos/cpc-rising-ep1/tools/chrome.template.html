<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; pointer-events: none; }
      </style>
      <div id="root" data-composition-id="chrome" data-width="1920" data-height="1080">
        <div class="progress"><span class="progress-fill" id="progress-fill"></span></div>
        <div class="topbar">
          <div class="brand"><img src="assets/logo-dark.png" alt="" /><span>Ep 01 · Google Ads</span></div>
          <div class="chapter-wrap">
<!--CHAPTERS-->
          </div>
        </div>
      </div>
      <script>
        (function () {
        const TOTAL = __TOTAL__;
        const CH = /*CH*/[]/*/CH*/;
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#progress-fill", { scaleX: 0 }, { scaleX: 1, duration: TOTAL, ease: "none" }, 0);
        CH.forEach(function (c, i) {
          const el = "#chapter-" + i;
          tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, c[0] + 0.3);
          if (i < CH.length - 1) tl.to(el, { opacity: 0, y: -10, duration: 0.3, ease: "power2.in" }, CH[i + 1][0] - 0.1);
        });
        window.__timelines["chrome"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
